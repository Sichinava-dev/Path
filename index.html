main{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:18px 16px 120px}
h1{font-family:var(--serif);font-weight:900;font-size:1.75rem;line-height:1.2;margin:6px 0 6px;
  background:linear-gradient(100deg,var(--gold) 38%,var(--shine) 50%,var(--gold) 62%) 0 0/260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 7s linear infinite}
@keyframes shimmer{to{background-position:-260% 0}}
.lead{color:var(--soft);margin:0 0 12px}
h2{font-family:var(--serif);font-weight:700;font-size:1.08rem;color:var(--gold);margin:30px 0 10px;display:flex;align-items:center;gap:12px;text-align:center}
h2::before,h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
h2::after{background:linear-gradient(270deg,transparent,var(--gold))}
h3{font-family:var(--serif);font-size:1.08rem;font-weight:700;margin:0;line-height:1.3}
p{margin:.35em 0}
.muted{color:var(--soft)} .small{font-size:.88rem}
.num{font-family:var(--num);font-weight:800;letter-spacing:.02em}
.rn{font-family:var(--rune)}
button,input{font:inherit;color:inherit} button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
/* stone tablet with gilded corners */
.win{position:relative;margin:12px 0;padding:16px;border:1px solid var(--line);
  background:
   linear-gradient(var(--gold),var(--gold)) top left/16px 1.5px no-repeat,
   linear-gradient(var(--gold),var(--gold)) top left/1.5px 16px no-repeat,
   linear-gradient(var(--gold),var(--gold)) top right/16px 1.5px no-repeat,
   linear-gradient(var(--gold),var(--gold)) top right/1.5px 16px no-repeat,
   linear-gradient(var(--gold),var(--gold)) bottom left/16px 1.5px no-repeat,
   linear-gradient(var(--gold),var(--gold)) bottom left/1.5px 16px no-repeat,
   linear-gradient(var(--gold),var(--gold)) bottom right/16px 1.5px no-repeat,
   linear-gradient(var(--gold),var(--gold)) bottom right/1.5px 16px no-repeat,
   linear-gradient(180deg,var(--panel2),var(--panel))}
.win.lit{border-color:color-mix(in srgb,var(--gold) 55%,var(--line));box-shadow:0 0 28px var(--glow),inset 0 0 40px var(--glow)}
.tag{display:block;font-size:.8rem;font-weight:700;color:var(--gold);margin-bottom:6px}
.tag::before{content:"ᛜ ";font-family:var(--rune)}
/* status (quests page) */
.status{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.hex{width:80px;height:80px;display:grid;place-items:center;text-align:center;background:var(--gold);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);position:relative;filter:drop-shadow(0 0 10px var(--glow))}
.hex::after{content:"";position:absolute;inset:2px;background:var(--panel);clip-path:inherit}
.hex>div{position:relative;z-index:1}
.hex small{display:block;font-family:var(--num);font-size:.68rem;color:var(--gold);line-height:1;letter-spacing:.18em}
.hex b{font-family:var(--num);font-size:1.9rem;line-height:1}
.rank{font-family:var(--num);font-weight:800;font-size:1.25rem;line-height:1.2;letter-spacing:.04em}
.rank .r{font-family:var(--rune);color:var(--arc);margin-right:8px}
.ttl-eq{font-family:var(--num);font-size:.86rem;color:var(--arc);font-weight:800;letter-spacing:.04em}
.xpbar{height:8px;background:var(--line);margin-top:8px;overflow:hidden;border-radius:4px;position:relative}
.xpbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--arc));box-shadow:0 0 12px var(--gold);transition:width .6s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
.xpbar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%);animation:sweep 3.2s ease-in-out infinite}
@keyframes sweep{60%,100%{transform:translateX(100%)}}
.xprow{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--soft);margin-top:5px}
.streak{display:flex;gap:8px;align-items:center;margin-top:12px;font-weight:700;font-size:.95rem;border-top:1px solid var(--line);padding-top:10px}
.flame{display:inline-block;animation:flick 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flick{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.12) rotate(3deg)}}
/* quests */
.quests{list-style:none;margin:0;padding:0}
.quests li+li{border-top:1px solid var(--line)}
.q{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:13px 0}
.q .ico{font-size:1.4rem;width:32px;text-align:center;flex:0 0 32px}
.q .t{font-weight:700;display:block}
.q .d{display:block;font-size:.85rem;color:var(--soft)}
.q .seal{margin-left:auto;flex:0 0 auto;min-width:64px;text-align:center;font-family:var(--num);font-weight:800;font-size:.8rem;color:var(--gold);border:1px solid var(--line);padding:4px 6px;border-radius:999px;transition:all .25s}
.q[aria-pressed="true"] .t{color:var(--gold)}
.q[aria-pressed="true"] .seal{background:var(--gold);color:var(--bg);border-color:var(--gold);box-shadow:0 0 14px var(--glow)}
.q[aria-pressed="true"] .ico{filter:drop-shadow(0 0 6px var(--gold))}
.qprog{display:flex;justify-content:space-between;font-weight:800;margin-bottom:4px}
.bonus{margin-top:12px;padding:10px 12px;background:var(--gold-soft);font-size:.92rem;font-weight:600;border-left:3px solid var(--gold)}
.alert{border-left:3px solid var(--ember);padding:8px 12px;margin:10px 0;font-size:.92rem;background:var(--panel)}
/* buttons */
.btn{border:1px solid transparent;padding:14px 18px;background:var(--ink);color:var(--bg);font-weight:800;border-radius:4px}
.btn.full{width:100%}
.btn.gold{background:linear-gradient(180deg,var(--shine),var(--gold) 60%);color:#1A1208;border-color:var(--gold);box-shadow:0 0 22px var(--glow);position:relative;overflow:hidden}
.btn.gold::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.5) 50%,transparent 60%);transform:translateX(-100%);animation:sweep 3.5s ease-in-out infinite}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.warn{background:transparent;color:var(--ember);border-color:var(--ember)}
.row{display:flex;gap:10px;align-items:center}
input[type=number],input[type=date]{background:var(--bg);border:1px solid var(--line);padding:12px;min-width:0;width:100%;font-size:1.05rem;border-radius:4px}
input:focus{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 14px var(--glow)}
label.f{display:block;font-size:.85rem;color:var(--soft);margin-bottom:4px}
/* mission page */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 8px}
.seg button{border:1px solid var(--line);background:var(--panel);padding:12px 8px;font-weight:800;border-radius:4px;line-height:1.3}
.seg button small{display:block;font-weight:600;color:var(--soft);font-size:.78rem}
.seg button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);box-shadow:inset 0 0 20px var(--glow)}
.how3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:10px}
.how3 div{border:1px solid var(--line);padding:10px 6px;font-size:.82rem;color:var(--soft)}
.how3 b{display:block;font-size:1.3rem;color:var(--gold)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.meta span{font-size:.82rem;border:1px solid var(--line);padding:3px 10px;border-radius:999px}
details.ex{border:1px solid var(--line);background:var(--panel);margin:8px 0;border-radius:4px}
details.ex[open]{border-color:color-mix(in srgb,var(--gold) 50%,var(--line));box-shadow:0 0 18px var(--glow)}
details.ex summary{list-style:none;display:flex;gap:12px;align-items:center;padding:13px 14px;cursor:pointer}
details.ex summary::-webkit-details-marker{display:none}
.ex .n{flex:0 0 34px;height:34px;display:grid;place-items:center;font-family:var(--num);font-weight:800;color:var(--gold);border:1px solid var(--gold);transform:rotate(45deg)}
.ex .n span{transform:rotate(-45deg)}
.ex .nm{flex:1;min-width:0}
.ex .nm b{display:block;line-height:1.3}
.ex .nm small{color:var(--soft)}
.ex .sr{font-family:var(--num);font-weight:800;color:var(--gold);font-size:.88rem;white-space:nowrap}
.ex .chev{transition:transform .25s;color:var(--soft)}
details.ex[open] .chev{transform:rotate(180deg)}
.exbody{padding:0 14px 14px}
.exbody ol{margin:.3em 0;padding-left:1.3em}
.exbody ol li{margin:.3em 0}
.exbody ol li::marker{font-family:var(--num);font-weight:800;color:var(--gold)}
.exbody h4{margin:12px 0 4px;font-size:.92rem;color:var(--gold)}
.exbody ul{margin:.2em 0;padding-left:1.1em;font-size:.94rem}
.lvls{display:grid;gap:6px;margin-top:4px}
.lvls div{font-size:.9rem;padding:7px 10px;border:1px solid var(--line);color:var(--soft);border-radius:4px}
.lvls div.on{border-color:var(--gold);color:var(--ink);background:var(--gold-soft)}
.lvls div b{color:var(--gold);margin-right:6px}
.warnline{font-size:.88rem;color:var(--ember);margin-top:8px}
.prevline{font-size:.88rem;color:var(--arc);font-weight:700;margin-top:8px}
.ritual{border:1px dashed var(--line);padding:12px 14px;margin:8px 0;border-radius:4px;font-size:.94rem}
.ritual b{color:var(--gold)}
.ritual ul{margin:.3em 0 0;padding-left:1.1em}
table.week{width:100%;border-collapse:collapse;font-size:.94rem}
table.week td{padding:9px 4px;border-top:1px solid var(--line)}
table.week tr:first-child td{border-top:0}
table.week tr.today td{color:var(--gold);font-weight:800}
.rules{margin:0;padding-left:1.3em} .rules li{margin:.45em 0}
.rules li::marker{font-family:var(--num);color:var(--gold);font-weight:800}
.hist{list-style:none;padding:0;margin:0}
.hist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;font-size:.95rem}
.hist li+li{border-top:1px solid var(--line)}
.del{background:none;border:0;color:var(--ember);font-size:.85rem;padding:4px}
/* guided runner */
.runner{position:fixed;inset:0;z-index:25;display:none;overflow-y:auto;
  background:radial-gradient(ellipse 120% 70% at 50% 0,var(--aglow),transparent 70%),var(--bg);
  padding:calc(env(safe-area-inset-top,0px) + 14px) 18px calc(env(safe-area-inset-bottom,0px) + 24px)}
.runner.on{display:block}
.rin{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.rtop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-right:52px}
.rtop .x{background:none;border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-size:.88rem;color:var(--soft)}
.rprog{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.rprog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--arc));transition:width .4s}
.rstage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:18px 0;animation:rise .35s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.rkick{font-size:.88rem;color:var(--arc);font-weight:700;text-align:center}
.rname{font-family:var(--serif);font-weight:900;font-size:1.9rem;text-align:center;line-height:1.2;margin:4px 0;color:var(--gold);text-shadow:0 0 22px var(--glow)}
.rsub{text-align:center;color:var(--soft);font-size:.95rem}
.rsets{display:flex;justify-content:center;gap:8px;margin:14px 0}
.rsets i{width:12px;height:12px;transform:rotate(45deg);border:1.5px solid var(--gold)}
.rsets i.done{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.rsets i.cur{background:var(--arc);border-color:var(--arc);box-shadow:0 0 10px var(--arc)}
.stepper{display:grid;grid-template-columns:72px 1fr 72px;align-items:center;gap:10px;margin:10px 0}
.stepper button{height:72px;border:1px solid var(--gold);background:var(--panel);font-family:var(--num);font-size:2rem;font-weight:800;color:var(--gold);border-radius:50%}
.stepper .val{text-align:center}
.stepper .val b{display:block;font-family:var(--num);font-size:3.6rem;line-height:1;text-shadow:0 0 24px var(--glow)}
.stepper .val small{color:var(--soft)}
.cues{border:1px solid var(--line);background:var(--panel);padding:10px 14px;margin:10px 0;font-size:.92rem;border-radius:4px}
.cues ol{margin:.2em 0;padding-left:1.2em}
.timer{position:relative;width:220px;height:220px;margin:8px auto}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .tv{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.timer .tv b{font-family:var(--num);font-size:3.4rem;line-height:1}
.timer .tv small{display:block;color:var(--soft)}
/* hero page */
.hero{text-align:center;padding:4px 0 6px}
.sigil{width:220px;height:220px;display:block;margin:0 auto;overflow:visible}
.spin{transform-box:view-box;transform-origin:center;animation:spin 80s linear infinite}
.spin.rev{animation-duration:120s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 3.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.hero .rank{font-size:1.5rem;margin-top:2px}
.hero .xpwrap{max-width:320px;margin:10px auto 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.stat{border:1px solid var(--line);padding:12px;background:var(--panel);position:relative;overflow:hidden;border-radius:4px}
.stat::after{content:attr(data-r);position:absolute;right:8px;bottom:-10px;font-family:var(--rune);color:var(--gold);opacity:.12;font-size:3.6rem;line-height:1}
.stat .k{font-size:.85rem;color:var(--soft)}
.stat .v{font-family:var(--num);font-weight:800;font-size:1.8rem;line-height:1.15;color:var(--gold)}
.stat .h{font-size:.76rem;color:var(--soft)}
/* titles hall */
.hallhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cat{font-family:var(--num);font-size:.85rem;color:var(--soft);font-weight:800;letter-spacing:.08em;margin:16px 0 6px}
.titles{display:grid;gap:8px}
.tt{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);padding:12px;border-radius:4px;position:relative}
.tt .em{width:46px;height:46px;display:grid;place-items:center;transform:rotate(45deg);border:2px solid var(--tc);background:color-mix(in srgb,var(--tc) 14%,transparent)}
.tt .em span{transform:rotate(-45deg);font-family:var(--rune);font-size:1.35rem;color:var(--tc)}
.tt .tn{font-family:var(--num);font-weight:800;line-height:1.25;letter-spacing:.03em}
.tt .tier{font-family:var(--num);font-size:.7rem;letter-spacing:.06em;font-weight:800;color:var(--tc);margin-left:6px;white-space:nowrap}
.tt .lore{font-size:.84rem;color:var(--soft);font-style:italic}
.tt .cond{font-size:.82rem;margin-top:4px}
.tt .tb{height:5px;background:var(--line);border-radius:3px;margin-top:5px;overflow:hidden}
.tt .tb i{display:block;height:100%;background:var(--tc)}
.tt.locked{opacity:.62}
.tt.locked .em{border-style:dashed;background:transparent}
.tt.locked .em span{opacity:.45}
.tt.got{border-color:color-mix(in srgb,var(--tc) 60%,var(--line))}
.tt.eq{box-shadow:0 0 0 1px var(--tc),0 0 22px color-mix(in srgb,var(--tc) 35%,transparent)}
.tt .badge{position:absolute;top:8px;right:10px;font-size:.72rem;font-weight:800;color:var(--tc)}
.tt.myth.got .em{animation:mythglow 2.6s ease-in-out infinite}
@keyframes mythglow{0%,100%{box-shadow:0 0 6px var(--tc)}50%{box-shadow:0 0 22px var(--tc)}}
.t-bronze{--tc:var(--bronze)} .t-silver{--tc:var(--silver)} .t-gold{--tc:var(--goldt)} .t-myth{--tc:var(--myth)}
/* food */
.meal{display:flex;gap:12px;padding:12px 0}
.meal+.meal{border-top:1px solid var(--line)}
.meal .time{flex:0 0 56px;font-family:var(--num);font-weight:800;color:var(--gold)}
.meal .k{font-size:.85rem;color:var(--soft)}
.supp{display:flex;gap:12px}
.supp .ico{font-size:1.5rem}
.supp .dose{font-weight:800;color:var(--gold)}
.supp ul{margin:.4em 0 0;padding-left:1.1em} .supp li{margin:.2em 0;font-size:.94rem}
textarea.code{display:block;width:100%;min-height:90px;margin-top:10px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px;font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--ink);word-break:break-all;resize:vertical}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.targets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.targets div{border:1px solid var(--line);padding:8px 4px;border-radius:4px}
.targets b{display:block;font-family:var(--num);font-size:1.2rem;color:var(--gold)}
.targets span{font-size:.8rem;color:var(--soft)}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{background:none;border:0;padding:8px 2px 10px;font-family:var(--num);letter-spacing:.06em;font-size:.74rem;font-weight:800;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
.tabs .e{font-family:var(--rune);font-size:1.45rem;line-height:1.2;opacity:.5;transition:all .25s}
.tabs button[aria-selected="true"]{color:var(--gold)}
.tabs button[aria-selected="true"] .e{opacity:1;text-shadow:0 0 12px var(--gold);transform:translateY(-2px)}
.tabs button[aria-selected="true"]::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:2px;background:var(--gold);box-shadow:0 0 10px var(--gold)}
/* ascension overlay */
.over{position:fixed;inset:0;background:rgba(6,4,10,.88);display:none;place-items:center;z-index:50;padding:24px}
.over.on{display:grid}
.asc{position:relative;max-width:360px;width:100%;text-align:center;color:#F1E9DA}
.asc .pillar{position:absolute;left:50%;top:-40vh;width:120px;height:80vh;transform:translateX(-50%) scaleY(0);transform-origin:50% 100%;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--og) 38%,transparent) 60%,transparent);filter:blur(8px);animation:pillar 1.2s .1s ease-out forwards;pointer-events:none}
@keyframes pillar{to{transform:translateX(-50%) scaleY(1)}}
.asc svg{width:220px;height:220px;display:block;margin:0 auto;overflow:visible}
.asc .draw{stroke-dasharray:541;stroke-dashoffset:541;animation:draw 1.1s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.asc .ringtext{opacity:0;animation:fadein .6s .8s forwards}
.asc .center{opacity:0;animation:fadein .5s 1.1s forwards}
@keyframes fadein{to{opacity:1}}
.asc .msg{font-family:var(--serif);font-weight:900;font-size:1.5rem;margin:8px 0 2px;color:var(--og);opacity:0;animation:fadein .5s 1.3s forwards}
.asc p{color:#C9BFD6;opacity:0;animation:fadein .5s 1.4s forwards}
.asc .btn{margin-top:16px;opacity:0;animation:fadein .4s 1.6s forwards}
.spark{position:fixed;width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);pointer-events:none;z-index:60;animation:spark .75s ease-out forwards}
.spark.a{background:var(--arc);box-shadow:0 0 10px var(--arc)}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.1);opacity:0}}
.ghostrune{position:fixed;pointer-events:none;z-index:60;font-family:var(--rune);font-size:2rem;color:var(--gold);text-shadow:0 0 14px var(--gold);animation:ghost .9s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes ghost{to{transform:translate(-50%,-160%) scale(1.6);opacity:0}}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--panel);color:var(--gold);border:1px solid var(--gold);box-shadow:0 0 20px var(--glow);padding:11px 18px;font-size:.95rem;font-weight:800;opacity:0;pointer-events:none;transition:opacity .2s;z-index:55;max-width:90vw;text-align:center;border-radius:4px}
.toast.on{opacity:1}
.sync{font-size:.76rem;color:var(--soft);text-align:center;margin-top:18px}
svg text{font-family:var(--num)}

.shield{margin-left:auto;font-family:var(--num);font-weight:800;font-size:.9rem;color:var(--gold)}
.bq{border-top:1px dashed var(--line)!important;margin-top:2px}
.ch{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:10px 0}
.ch+.ch{border-top:1px solid var(--line)}

let restTick=null;
function _oldbeep(){ try{ if(!actx) return; const o=actx.createOscillator(),g=actx.createGain(); o.frequency.value=660; o.type="sine"; g.gain.setValueAtTime(.0001,actx.currentTime); g.gain.exponentialRampToValueAtTime(.25,actx.currentTime+.02); g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.5); o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+.55);}catch(e){} }
function startRun(type,fresh){
  SFX.init();
  if(fresh || !S.run || S.run.type!==type) S.run={type,step:-1,set:0,rest:false,restEnd:0,reps:{},cur:null};
  ui.running=true; save(); renderRun();
}
function closeRun(){ ui.running=false; clearInterval(restTick); $("#runner").classList.remove("on"); render(); }
function runDone(){ let n=0; const w=WORKOUTS[S.run.type]; w.ex.forEach(e=>{n+=(S.run.reps[e.id]||[]).filter(x=>x!=null&&x!=="").length;}); return n; }
function defaultReps(e,set){ const pr=lastReps(e.id); if(pr&&pr[set]!=null&&pr[set]!=="") return +pr[set]; return e.min; }
function renderRun(){
  const R=S.run, w=WORKOUTS[R.type], n=w.ex.length, el=$("#runner");
  const total=w.ex.reduce((a,e)=>a+e.sets,0);

  let stage="";
  if(R.step===-1){
    stage=`<div class="rkick">Step 1 · Preparation</div><div class="rname">Warm-Up</div><div class="rsub">5 წუთი — სხეული და სახსრები გაათბე, რომ არ დაშავდე.</div>
      <div class="cues"><ol>${WARMUP.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>

  } else if(R.step>=n){
    stage=`<div class="rkick">Final Step</div><div class="rname">Cool-Down</div><div class="rsub">3 წუთი — კუნთები მოადუნე.</div>

  } else {
    const e=w.ex[R.step];

      const nextE = R.set>0 ? e : w.ex[R.step];
      const left=Math.max(0,Math.ceil((R.restEnd-Date.now())/1000));
      const label = R.set>0 ? `შემდეგი: ${esc(e.name)} — სეტი ${R.set+1} / ${e.sets}` : `შემდეგი სავარჯიშო: ${esc(nextE.name)}`;
      stage=`<div class="rkick">Rest</div>
        <div class="timer"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="var(--line)" stroke-width="6"/><circle id="ring" cx="60" cy="60" r="54" fill="none" stroke="var(--gold)" stroke-width="6" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="0" style="filter:drop-shadow(0 0 6px var(--gold))"/></svg>

        <div class="rsub" style="margin-bottom:12px">${label}</div>

      setTimeout(()=>{ const ring=$("#ring"), rt=$("#rt"), dur=R.restDur||60;
        let lastS=null; restTick=setInterval(()=>{ const ms=R.restEnd-Date.now(); const s=Math.max(0,Math.ceil(ms/1000)); if(s!==lastS){ if(lastS!==null&&s>0&&s<=3) SFX.play('tick'); lastS=s; }
          if(rt) rt.textContent=s; if(ring) ring.setAttribute("stroke-dashoffset",(339.3*(1-Math.max(0,ms)/(dur*1000))).toFixed(1));

        },200); },0);

function runAdvance(){

function chart(pts){
  if(pts.length<2) return `<p class="muted small">გრაფიკი გამოჩნდება, როცა მეორე წონას ჩაწერ.</p>`;
  const W=600,H=200,P=30; const ys=pts.map(p=>p.kg).concat(BOSSES.filter(b=>b.kg-2<=Math.max(...pts.map(p=>p.kg))).map(b=>b.kg));
  let mn=Math.min(...ys),mx=Math.max(...ys); if(mx-mn<2){mn-=1;mx+=1;}
  const t0=parse(pts[0].d).getTime(), t1=parse(pts[pts.length-1].d).getTime();
  const X=t=>P+(W-P*2)*((t-t0)/((t1-t0)||1)), Y=v=>H-P-(H-P*2)*((v-mn)/(mx-mn));
  const path=pts.map((p,i)=>(i?"L":"M")+X(parse(p.d).getTime()).toFixed(1)+" "+Y(p.kg).toFixed(1)).join(" ");
  const dots=pts.map(p=>`<circle cx="${X(parse(p.d).getTime()).toFixed(1)}" cy="${Y(p.kg).toFixed(1)}" r="5" style="fill:var(--gold)"/>`).join("");
  const bossLines=BOSSES.filter(b=>b.kg>=mn&&b.kg<=mx).map(b=>`<line x1="${P}" x2="${W-P}" y1="${Y(b.kg)}" y2="${Y(b.kg)}" style="stroke:${b.col}" stroke-dasharray="6 6"/><text x="${W-P}" y="${Y(b.kg)-6}" font-size="14" style="fill:${b.col}" text-anchor="end">${b.name} · ${b.kg}</text>`).join("");
  const grid=[mn,mx].map(v=>`<text x="2" y="${Y(v)+5}" font-size="14" style="fill:var(--soft)">${v.toFixed(0)}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="წონის გრაფიკი">${grid}${bossLines}<path class="drawline" d="${path}" fill="none" style="stroke:var(--gold);filter:drop-shadow(0 0 4px var(--gold))" stroke-width="3" stroke-linejoin="round" pathLength="1"/>${dots}</svg>`;
}

function xpFloat(x,y,txt){ if(REDUCED) return; const e=document.createElement("div"); e.className="xpfloat num"; e.textContent=txt; e.style.left=x+"px"; e.style.top=y+"px"; document.body.appendChild(e); setTimeout(()=>e.remove(),1300); }
function ripple(el){ if(REDUCED) return; const r=document.createElement("span"); r.className="ripple"; el.appendChild(r); setTimeout(()=>r.remove(),800); }

  if(ui.hitFrom!=null){ const gh=$("#hpghost"), g=game(); if(gh&&g.boss){ setTimeout(()=>{ gh.style.width=(bossHP(g.boss,g.maxKg).pct*100).toFixed(1)+"%"; },450); } setTimeout(()=>{ const c=$(".boss-enc"); c&&c.classList.remove("hit"); },700); ui.hitFrom=null; }
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===ui.tab));

function act(){ save(); render(); celebrate(); }
function addWeight(k,val){
  const kg=parseFloat(String(val).replace(",","."));
  if(!(kg>30&&kg<200)){toast("ჩაწერე წონა კილოგრამებში, მაგ. 54.6",1);return false;}
  const g0=game(), b0=g0.boss, pct0=b0?bossHP(b0,g0.maxKg).pct:null;
  S.weights=S.weights.filter(w=>w.d!==k); S.weights.push({d:k,kg});
  const g1=game();
  if(b0 && g1.maxKg>g0.maxKg){ const dmg=Math.min(g1.maxKg,b0.kg)-g0.maxKg; ui.hitFrom=pct0; SFX.play("hit"); toast("⚔️ "+b0.name+" −"+dmg.toFixed(1)+" HP · +"+XP.weigh+" XP"); screenFX("shake",b0.col+"55"); }
  else { SFX.play("save"); toast("+"+XP.weigh+" XP · "+kg.toFixed(1)+" კგ"); }
  return true;
}

    if(before<PROFILE.kcal&&kcalDay(k)>=PROFILE.kcal){SFX.play("check");toast("🍖 კალორიის მიზანი შესრულდა! +"+XP.kcal+" XP");} else toast("+"+kk+" კკალ");
    act(); return; }
  if("goFood" in t.dataset){ SFX.play("tab"); ui.enter=true; ui.tab="food"; render(); scrollTo(0,0); return; }

  if(t.dataset.check){const k=todayKey(),dd=dayData(k),id=t.dataset.check;dd.c[id]=!dd.c[id];
    if(dd.c[id]){const b=t.querySelector(".seal").getBoundingClientRect();burst(b.left+b.width/2,b.top+b.height/2);xpFloat(b.left+b.width/2,b.top,"+"+XP[id]+" XP");ripple(t);
      if(dayComplete(k)){SFX.play("dayDone");toast("ᛝ ყველა კვესტი შესრულდა! +"+XP.bonus+" XP");screenFX("",null);} else SFX.play("check");}
    else SFX.play("uncheck");
    act();return;}
  if(t.dataset.goTrain){SFX.play("tab");ui.enter=true;ui.tab="train";ui.wtype=t.dataset.goTrain;render();scrollTo(0,0);return;}
  if(t.dataset.wt){SFX.play("tab");ui.wtype=t.dataset.wt;render();return;}
  if(t.dataset.equip){SFX.play("equip");S.title=t.dataset.equip;const b=t.getBoundingClientRect();burst(b.left+30,b.top+b.height/2);save();render();toast("ტიტული აღიჭურვე");return;}
  if(t.dataset.dels){if(confirm("წავშალო ეს მისია?")){S.sessions.splice(+t.dataset.dels,1);act();}return;}
  if(t.dataset.delw){if(confirm("წავშალო ეს ჩანაწერი?")){S.weights=S.weights.filter(w=>w.d!==t.dataset.delw);act();}return;}
  if(t.dataset.addw){if(addWeight(t.dataset.addw,$("#qw").value)) act();return;}
  if("addw2" in t.dataset){if(addWeight($("#wd").value||todayKey(),$("#wk").value)) act();return;}
  if("addm" in t.dataset){const a=$("#ma").value,c=$("#mc").value,w=$("#mw").value;
    if(!a&&!c&&!w){toast("ჩაწერე ერთი ზომა მაინც",1);return;}
    SFX.play("save");
    S.measures.push({d:todayKey(),a,c,w});toast("+"+XP.measure+" XP · ზომები შენახულია");act();return;}
  if("export" in t.dataset){ const o=JSON.parse(JSON.stringify(S)); o.run=null; ui.xcode="MASA1:"+btoa(unescape(encodeURIComponent(JSON.stringify(o)))); SFX.play("save"); render(); setTimeout(()=>{const x=$("#xcode"); if(x){x.focus();x.select();}},50); return; }
  if("copy" in t.dataset){ const x=$("#xcode"); x.focus(); x.select(); x.setSelectionRange(0,x.value.length);
    const ok=()=>{SFX.play("check");toast("კოდი დაკოპირდა");}; 
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(x.value).then(ok).catch(()=>{ try{document.execCommand("copy");ok();}catch(e){toast("მონიშნე და ხელით დააკოპირე",1);} }); }
    else { try{document.execCommand("copy");ok();}catch(e){toast("მონიშნე და ხელით დააკოპირე",1);} } return; }
  if("import" in t.dataset){ const v=($("#icode").value||"").trim();
    try{ if(!v.startsWith("MASA1:")) throw 0; const o=JSON.parse(decodeURIComponent(escape(atob(v.slice(6)))));
      if(!o||typeof o!=="object"||!o.days||!Array.isArray(o.weights)) throw 0;
      if(!confirm("ახლანდელი მონაცემები შეიცვლება კოდიდან ჩატვირთულით. გავაგრძელო?")) return;
      S=Object.assign(blank(),o); S.v4init=true; markSeen(); S.updatedAt=0; save(); ui.xcode=null; render(); SFX.play("equip"); toast("პროგრესი წარმატებით გადმოვიდა!");
    }catch(e){ toast("კოდი არასწორია — დარწმუნდი, რომ მთლიანად ჩასვი",1); } return; }
  if("setstart" in t.dataset){const v=$("#sd").value;if(v){S.start=v;act();toast("თარიღი შეიცვალა");}return;}
  if("reset" in t.dataset){if(confirm("ნამდვილად წავშალო ყველა ჩანაწერი? დონე, XP და ტიტულები განულდება.")){S=blank();S.v4init=true;save();render();toast("ახალი თავგადასავალი დაიწყო");}return;}
});
document.addEventListener("change",e=>{ if(e.target.id==="rh"){ S.resetHour=+e.target.value; RESET_H=S.resetHour; SFX.play("save"); save(); render(); toast("ახალი დღე იწყება "+String(S.resetHour).padStart(2,"0")+":00-ზე"); } });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&$("#over").classList.contains("on")) $("#over").classList.remove("on"); });
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && ui.running && S.run) renderRun(); });

/* ================= ცოცხალი ფონი: მოფარფატე ნაპერწკლები ================= */
(function(){
  const c=document.getElementById("motes"); if(REDUCED||!c.getContext){c.remove();return;}
  const x=c.getContext("2d"); const dpr=Math.min(2,window.devicePixelRatio||1); let W,H,P=[],cols={};
  function size(){W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr;c.style.width=innerWidth+"px";c.style.height=innerHeight+"px";}
  function readCols(){const s=getComputedStyle(document.documentElement);cols.g=s.getPropertyValue("--gold").trim();cols.v=s.getPropertyValue("--arc").trim();}
  function spawn(init){return {x:Math.random()*W,y:init?Math.random()*H:H+10*dpr,r:(Math.random()*1.5+.6)*dpr,s:(Math.random()*.25+.07)*dpr,ph:Math.random()*6.28,a:Math.random()*.5+.25,c:Math.random()<.65?"g":"v"};}
  window.__readCols=readCols; size();readCols();addEventListener("resize",size);matchMedia("(prefers-color-scheme: dark)").addEventListener("change",readCols);
  for(let i=0;i<32;i++)P.push(spawn(true));
  let t=0;
  function frame(){ if(document.hidden){requestAnimationFrame(frame);return;}
    t+=.016; x.clearRect(0,0,W,H);
    for(const p of P){ p.y-=p.s; p.x+=Math.sin(t+p.ph)*.25*dpr; if(p.y<-10) Object.assign(p,spawn(false));
      const tw=.5+.5*Math.sin(t*2+p.ph); x.globalAlpha=p.a*(.4+.6*tw); x.fillStyle=cols[p.c]; x.shadowColor=cols[p.c]; x.shadowBlur=8*dpr;
      x.beginPath(); x.arc(p.x,p.y,p.r,0,6.283); x.fill(); }
    requestAnimationFrame(frame);}
  requestAnimationFrame(frame);
})();

if(!S.v4init){markSeen();S.v4init=true;}
ui.enter=true;
if(!S.updatedAt) save();
render();
try{ if("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())); if(window.caches) caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))); }catch(e){}
</script>
